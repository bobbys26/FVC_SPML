<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volleyball Tournament 2026</title>
    <style>
        :root {
            --color-bg-primary: #0f172a;
            --color-bg-secondary: #1e293b;
            --color-bg-tertiary: #334155;
            --color-text-primary: #f1f5f9;
            --color-text-secondary: #cbd5e1;
            --color-text-muted: #94a3b8;
            --color-accent: #38bdf8;
            --color-accent-hover: #0ea5e9;
            --color-success: #10b981;
            --color-warning: #f59e0b;
            --color-danger: #ef4444;
            --color-border: #475569;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 20px;
            background: var(--color-bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--color-border);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--color-accent);
        }

        .subtitle {
            color: var(--color-text-muted);
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--color-border);
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: var(--color-text-secondary);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab:hover {
            color: var(--color-accent);
        }

        .tab.active {
            color: var(--color-accent);
            border-bottom-color: var(--color-accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .standings-table {
            background: var(--color-bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--color-border);
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--color-bg-tertiary);
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: var(--color-accent);
            border-bottom: 2px solid var(--color-border);
        }

        th.center, td.center {
            text-align: center;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--color-border);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: rgba(56, 189, 248, 0.05);
        }

        .rank-1 {
            background: rgba(16, 185, 129, 0.1);
        }

        .rank-2 {
            background: rgba(245, 158, 11, 0.1);
        }

        .rank-3 {
            background: rgba(139, 92, 246, 0.1);
        }

        .match-card {
            background: var(--color-bg-secondary);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s ease;
        }

        .match-card:hover {
            transform: translateX(5px);
            border-color: var(--color-accent);
        }

        .match-teams {
            flex: 1;
        }

        .team-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 8px;
        }

        .team-name {
            font-weight: 600;
            font-size: 1.1rem;
            min-width: 180px;
        }

        .winner {
            color: var(--color-success);
        }

        .loser {
            color: var(--color-text-muted);
        }

        .sets {
            display: flex;
            gap: 10px;
        }

        .set-score {
            background: var(--color-bg-tertiary);
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 500;
            min-width: 35px;
            text-align: center;
        }

        .match-info {
            text-align: right;
            color: var(--color-text-muted);
            font-size: 0.9rem;
        }

        .match-date {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .match-score {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-accent);
        }

        .schedule-match {
            background: var(--color-bg-secondary);
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 12px;
            border: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .schedule-teams {
            font-size: 1.1rem;
        }

        .vs {
            color: var(--color-text-muted);
            margin: 0 12px;
        }

        .status-badge {
            background: var(--color-bg-tertiary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--color-warning);
            font-weight: 500;
        }

        .filter-section {
            background: var(--color-bg-secondary);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid var(--color-border);
        }

        .filter-controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            color: var(--color-text-secondary);
            font-weight: 500;
        }

        select, input {
            background: var(--color-bg-tertiary);
            color: var(--color-text-primary);
            border: 1px solid var(--color-border);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--color-bg-secondary);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--color-border);
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--color-accent);
            margin-bottom: 8px;
        }

        .stat-label {
            color: var(--color-text-secondary);
            font-size: 0.95rem;
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-text-muted);
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .match-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .match-info {
                text-align: left;
                width: 100%;
            }

            .team-name {
                min-width: 120px;
            }

            .tabs {
                overflow-x: auto;
            }

            .filter-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

               onmouseover="this.style.background='var(--color-accent-hover)'"
               onmouseout="this.style.background='var(--color-accent)'">

            </a>

        <div class="tabs">
            <button class="tab active" onclick="showTab('standings')">Standings</button>
            <button class="tab" onclick="showTab('results')">Match Results</button>

                    <tbody id="standings-body"></tbody>
                </table>
            </div>
        </div>

        <!-- Match Results Tab -->
        <div id="results-tab" class="tab-content">
            <div class="filter-section">
                <div class="filter-controls">
                    <div class="filter-group">
                        <label for="team-filter">Filter by Team:</label>
                        <select id="team-filter" onchange="filterResults()">
                            <option value="">All Teams</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="date-filter">Filter by Date:</label>
                        <select id="date-filter" onchange="filterResults()">
                            <option value="">All Dates</option>
                        </select>
                    </div>
                </div>
            </div>
            <div id="results-container"></div>
        </div>

        <!-- Upcoming Matches Tab -->
        <div id="schedule-tab" class="tab-content">
            <div class="filter-section">
                <div class="filter-controls">
                    <div class="filter-group">
                        <label for="schedule-date-filter">Filter by Date:</label>
                        <select id="schedule-date-filter" onchange="filterSchedule()">
                            <option value="">All Dates</option>
                        </select>
                    </div>
                </div>
            </div>
            <div id="schedule-container"></div>
        </div>

        <!-- Statistics Tab -->
        <div id="stats-tab" class="tab-content">
            <div class="stats-grid" id="stats-grid"></div>
        </div>
    </div>

        function calculateTeamStats() {
            const stats = {};
            tournamentData.standings.forEach(team => {
                stats[team.team] = {
                    wins: 0,
                    losses: 0,
                    setsWon: 0,
                    setsLost: 0,
                    pointsFor: 0,
                    pointsAgainst: 0
                };
            });

            tournamentData.matches.forEach(match => {
                if (match.homeTotal && match.awayTotal) {
                    const homeWin = parseInt(match.homeTotal) > parseInt(match.awayTotal);
                    
                    if (homeWin) {
                        stats[match.home].wins++;
                        stats[match.away].losses++;
                    } else {
                        stats[match.away].wins++;
                        stats[match.home].losses++;
                    }

                    stats[match.home].setsWon += parseInt(match.homeTotal);
                    stats[match.home].setsLost += parseInt(match.awayTotal);
                    stats[match.away].setsWon += parseInt(match.awayTotal);
                    stats[match.away].setsLost += parseInt(match.homeTotal);

                    match.sets.forEach(set => {
                        if (set[0] && set[1]) {
                            stats[match.home].pointsFor += parseInt(set[0]);
                            stats[match.home].pointsAgainst += parseInt(set[1]);
                            stats[match.away].pointsFor += parseInt(set[1]);
                            stats[match.away].pointsAgainst += parseInt(set[0]);
                        }
                    });
                }
            });

            return stats;
        }

        function renderStandings() {
            const tbody = document.getElementById('standings-body');
            const stats = calculateTeamStats();
            
            tbody.innerHTML = tournamentData.standings.map(team => {
                let rowClass = '';
                if (team.rank === 1) rowClass = 'rank-1';
                else if (team.rank === 2) rowClass = 'rank-2';
                else if (team.rank === 3) rowClass = 'rank-3';

                return `
                    <tr class="${rowClass}">
                        <td class="center">${team.rank}</td>
                        <td><strong>${team.team}</strong></td>
                        <td class="center"><strong>${team.points}</strong></td>
                        <td class="center">${team.games}</td>
                        <td class="center">${stats[team.team].wins}</td>
                        <td class="center">${stats[team.team].losses}</td>
                    </tr>
                `;
            }).join('');
        }

        function renderResults() {
            const container = document.getElementById('results-container');
            const matches = tournamentData.matches;

            if (matches.length === 0) {
                container.innerHTML = '<div class="no-data">No match results available yet.</div>';
                return;
            }

            container.innerHTML = matches.map(match => {
                const homeTotal = parseInt(match.homeTotal) || 0;
                const awayTotal = parseInt(match.awayTotal) || 0;
                const homeWin = homeTotal > awayTotal;

                return `
                    <div class="match-card">
                        <div class="match-teams">
                            <div class="team-row">
                                <span class="team-name ${homeWin ? 'winner' : 'loser'}">${match.home}</span>
                                <div class="sets">
                                    ${match.sets.map(set => `<span class="set-score">${set[0]}</span>`).join('')}
                                </div>
                            </div>
                            <div class="team-row">
                                <span class="team-name ${!homeWin ? 'winner' : 'loser'}">${match.away}</span>
                                <div class="sets">
                                    ${match.sets.map(set => `<span class="set-score">${set[1]}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                        <div class="match-info">
                            <div class="match-date">${match.date}</div>
                            <div class="match-score">${match.homeTotal} - ${match.awayTotal}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderSchedule() {

            container.innerHTML = matches.map(match => {

                    <div class="schedule-match">

                            <span class="vs">vs</span>

                        </div>

                    </div>
                `;
            }).join('');
        }

        function renderStats() {

            const totalSets = tournamentData.matches.reduce((sum, m) => 
                sum + (parseInt(m.homeTotal) || 0) + (parseInt(m.awayTotal) || 0), 0);
            const upcomingMatches = tournamentData.upcomingMatches.length;

            let highestPoints = Math.max(...tournamentData.standings.map(t => t.points));
            let topTeam = tournamentData.standings.find(t => t.points === highestPoints);

            container.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${totalMatches}</div>
                    <div class="stat-label">Matches Played</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${upcomingMatches}</div>
                    <div class="stat-label">Upcoming Matches</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${totalSets}</div>
                    <div class="stat-label">Total Sets Played</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${topTeam.team}</div>
                    <div class="stat-label">Current Leader</div>
                </div>
            `;
        }

        function populateFilters() {
            const teams = [...new Set(tournamentData.matches.flatMap(m => [m.home, m.away]))].sort();
            const teamFilter = document.getElementById('team-filter');
            teamFilter.innerHTML = '<option value="">All Teams</option>' + 
                teams.map(team => `<option value="${team}">${team}</option>`).join('');

            const dates = [...new Set(tournamentData.matches.map(m => m.date))].sort();
            const dateFilter = document.getElementById('date-filter');
            dateFilter.innerHTML = '<option value="">All Dates</option>' + 
                dates.map(date => `<option value="${date}">${date}</option>`).join('');

            const scheduleDates = [...new Set(tournamentData.upcomingMatches.map(m => m.date))].sort();
            const scheduleDateFilter = document.getElementById('schedule-date-filter');
            scheduleDateFilter.innerHTML = '<option value="">All Dates</option>' + 
                scheduleDates.map(date => `<option value="${date}">${date}</option>`).join('');
        }

        function filterResults() {
            const teamFilter = document.getElementById('team-filter').value;
            const dateFilter = document.getElementById('date-filter').value;

            let filtered = tournamentData.matches;

            if (teamFilter) {
                filtered = filtered.filter(m => m.home === teamFilter || m.away === teamFilter);
            }

            if (dateFilter) {
                filtered = filtered.filter(m => m.date === dateFilter);
            }

            const container = document.getElementById('results-container');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-data">No matches found with selected filters.</div>';
                return;
            }

            container.innerHTML = filtered.map(match => {
                const homeTotal = parseInt(match.homeTotal) || 0;
                const awayTotal = parseInt(match.awayTotal) || 0;
                const homeWin = homeTotal > awayTotal;

                return `
                    <div class="match-card">
                        <div class="match-teams">
                            <div class="team-row">
                                <span class="team-name ${homeWin ? 'winner' : 'loser'}">${match.home}</span>
                                <div class="sets">
                                    ${match.sets.map(set => `<span class="set-score">${set[0]}</span>`).join('')}
                                </div>
                            </div>
                            <div class="team-row">
                                <span class="team-name ${!homeWin ? 'winner' : 'loser'}">${match.away}</span>
                                <div class="sets">
                                    ${match.sets.map(set => `<span class="set-score">${set[1]}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                        <div class="match-info">
                            <div class="match-date">${match.date}</div>
                            <div class="match-score">${match.homeTotal} - ${match.awayTotal}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterSchedule() {
            const dateFilter = document.getElementById('schedule-date-filter').value;
            let filtered = tournamentData.upcomingMatches;

            if (dateFilter) {
                filtered = filtered.filter(m => m.date === dateFilter);
            }

            const container = document.getElementById('schedule-container');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-data">No matches scheduled for selected date.</div>';
                return;
            }

            container.innerHTML = filtered.map(match => {
                return `
                    <div class="schedule-match">
                        <div class="schedule-teams">
                            <strong>${match.home}</strong>
                            <span class="vs">vs</span>
                            <strong>${match.away}</strong>
                        </div>
                        <div>
                            <span style="color: var(--color-text-muted); margin-right: 15px;">${match.date}</span>
                            <span class="status-badge">Scheduled</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showTab(tabName) {
            const tabs = document.querySelectorAll('.tab');
            const contents = document.querySelectorAll('.tab-content');

            tabs.forEach(tab => tab.classList.remove('active'));
            contents.forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tabName + '-tab').classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderStandings();
            renderResults();
            renderSchedule();
            renderStats();
            populateFilters();
        });
    </script>
</body>
</html>
