<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Add glass effect styling */
        .glass {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 10px;
        }
        /* Smooth animations */
        .fade-in {
            animation: fadeIn 1s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-5">
        <h1 class="text-3xl font-bold text-center">Tournament Dashboard</h1>
        <div class="flex justify-center pt-5">
            <div class="tabs flex space-x-4">
                <button class="tab glass py-2 px-4 rounded focus:outline-none">Standings</button>
                <button class="tab glass py-2 px-4 rounded focus:outline-none">Match Results</button>
                <button class="tab glass py-2 px-4 rounded focus:outline-none">Schedule</button>
                <button class="tab glass py-2 px-4 rounded focus:outline-none">Statistics</button>
            </div>
        </div>
        <div class="content fade-in">
            <!-- Include your tournament data here -->
            <div id="standings">
                <h2 class="text-xl font-semibold">Standings</h2>
                <!-- Include standings data -->
            </div>
            <div id="match-results">
                <h2 class="text-xl font-semibold">Match Results</h2>
                <!-- Include match results data -->
            </div>
            <div id="schedule">
                <h2 class="text-xl font-semibold">Schedule</h2>
                <!-- Include schedule data -->
            </div>
            <div id="statistics">
                <h2 class="text-xl font-semibold">Statistics</h2>
                <!-- Include statistics data -->
            </div>
        </div>
    </div>
</body>
</html>
